<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌍 Climate Smart Agric - Planting Suitability</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, #E8F5E9, #FFF3E0);
    color: #333;
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 240px;
    background: linear-gradient(180deg, #228B22, #FF9800);
    color: #fff;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    overflow-y: auto;
    box-shadow: 3px 0 10px rgba(0,0,0,0.3);
    transition: width 0.3s ease, transform 0.3s ease;
    z-index: 20;
  }
  .sidebar.collapsed { width: 70px; }

  .sidebar h2 {
    text-align: center;
    padding: 1rem 0;
    margin: 0;
    background: rgba(255,255,255,0.15);
    font-size: 1.5rem;
    transition: opacity 0.3s ease;
  }
  .sidebar.collapsed h2 { opacity: 0; }

  .sidebar nav {
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  .sidebar nav a {
    color: #fff;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
    margin: 4px 0;
    font-weight: 500;
    transition: background 0.3s, padding-left 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar nav a:hover {
    background: rgba(255,255,255,0.25);
    padding-left: 24px;
  }

  .user-info {
    text-align: center;
    margin-top: 10px;
    font-weight: 500;
  }

  /* Hamburger */
  .hamburger {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 40px;
    height: 34px;
    background: linear-gradient(135deg, #228B22, #FF9800);
    border: none;
    border-radius: 8px;
    flex-direction: column;
    justify-content: space-around;
    display: flex;
    z-index: 1000; /* always on top */
    cursor: pointer;
    padding: 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  .hamburger span {
    background: #fff; /* white lines for visibility */
    height: 3px;
    border-radius: 2px;
    width: 100%;
    transition: transform 0.3s, opacity 0.3s;
  }
  .hamburger:hover {
    transform: scale(1.05);
  }

  /* Content area */
  .content {
    margin-left: 240px;
    width: calc(100% - 240px);
    transition: margin-left 0.3s ease, width 0.3s ease;
    padding: 30px;
  }
  .sidebar.collapsed ~ .content {
    margin-left: 70px;
    width: calc(100% - 70px);
  }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }
    .sidebar.active {
      transform: translateX(0);
    }
    .content {
      margin-left: 0;
      width: 100%;
    }
  }

  /* Page-Specific Styles */
  main {
    max-width: 600px;
    margin: auto;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    margin-top: 60px;
    padding: 30px;
  }

  h2 {
    color: #fff;
    margin-bottom: 15px;
  }

  label {
    font-weight: 600;
    color: #333;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    transition: 0.2s;
  }
  input:focus {
    border-color: #FF9800;
    outline: none;
    box-shadow: 0 0 6px rgba(255,152,0,0.4);
  }

  button {
    background: linear-gradient(135deg, #FF9800, #2E7D32);
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
    width: 100%;
  }
  button:hover {
    background: linear-gradient(135deg, #2E7D32, #FF9800);
    transform: scale(1.05);
  }

  #output {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
    font-size: 1rem;
    line-height: 1.4;
  }
  #output h3 {
    margin: 0 0 10px;
  }

  footer {
    background: linear-gradient(90deg, #228B22, #FF9800);
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 0.95rem;
    margin-top: 60px;
    border-radius: 10px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>

<!-- Hamburger -->
<button class="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <h2>🌍 Climate Smart Agric</h2>
  <nav>
    <a href="{% url 'index' %}">🏠 Home</a>
    <a href="{% url 'adaptation_strategies' %}">🌱 Strategies</a>
    <a href="{% url 'community_forum' %}">💬 Community</a>
    <a href="{% url 'crop_rec' %}">🌾 Crop Prediction</a>
    <a href="{% url 'blog_news' %}">📰 Blog</a>
    <a href="{% url 'about_us' %}">ℹ️ About</a>
    <a href="{% url 'help_support' %}">❓ Help</a>

    {% if user.is_authenticated %}
      <div class="user-info">👋 {{ user.username }}</div>
      <a href="{% url 'logout' %}">🚪 Logout</a>
    {% endif %}
  </nav>
</aside>

<!-- Main Content -->
<div class="content">
  <main>
    <h2>Enter Weather Features</h2>
    <form id="weatherForm">
      <label>7-day Avg Precipitation (mm):</label>
      <input type="number" step="0.1" id="precip_7d_mean" required>

      <label>7-day Avg Max Temperature (°C):</label>
      <input type="number" step="0.1" id="tempmax_7d_mean" required>

      <label>7-day Avg Min Temperature (°C):</label>
      <input type="number" step="0.1" id="tempmin_7d_mean" required>

      <label>7-day Avg Wind Speed (m/s):</label>
      <input type="number" step="0.1" id="wind_7d_mean" required>

      <label>3-day Precipitation Sum (mm):</label>
      <input type="number" step="0.1" id="precip_3d_sum" required>

      <label>Month:</label>
      <input type="number" id="month" min="1" max="12" required>

      <label>Day of Year:</label>
      <input type="number" id="day_of_year" min="1" max="366" required>

      <button type="submit">Predict Suitability</button>
    </form>

    <div id="output"></div>
  </main>

  <footer>
    <p>&copy; 2025 Climate Smart Agric | All Rights Reserved 🌎</p>
  </footer>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  if (window.innerWidth <= 768) {
    sidebar.classList.toggle("active");
  } else {
    sidebar.classList.toggle("collapsed");
  }
}

document.getElementById('weatherForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const data = {
    precip_7d_mean: parseFloat(document.getElementById('precip_7d_mean').value),
    tempmax_7d_mean: parseFloat(document.getElementById('tempmax_7d_mean').value),
    tempmin_7d_mean: parseFloat(document.getElementById('tempmin_7d_mean').value),
    wind_7d_mean: parseFloat(document.getElementById('wind_7d_mean').value),
    precip_3d_sum: parseFloat(document.getElementById('precip_3d_sum').value),
    month: parseInt(document.getElementById('month').value),
    day_of_year: parseInt(document.getElementById('day_of_year').value)
  };

  const outputDiv = document.getElementById('output');
  try {
    const response = await fetch("/predict_time/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    outputDiv.style.display = "block";

    if(result.error){
      outputDiv.style.background = "#ffebee";
      outputDiv.style.color = "#b71c1c";
      outputDiv.innerHTML = "❌ Error: " + result.error;
    } else {
      const suitability = result.suitability === 1 ? "✅ Suitable" : "❌ Not Suitable";
      const probability = (result.probability * 100).toFixed(1) + "%";
      const recommendation = result.recommendation;

      outputDiv.style.background = "#e8f5e9";
      outputDiv.style.color = "#1b5e20";
      outputDiv.innerHTML = `
        <h3>${suitability}</h3>
        <p><strong>Probability:</strong> ${probability}</p>
        <p><strong>Recommendation:</strong> ${recommendation}</p>
      `;
    }
  } catch (err) {
    outputDiv.style.display = "block";
    outputDiv.style.background = "#ffebee";
    outputDiv.style.color = "#b71c1c";
    outputDiv.innerText = "❌ Error: " + err.message;
  }
});
</script>
</body>
</html>
